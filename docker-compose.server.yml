# docker-compose.server.yml — фрагмент для добавления в /opt/media_stack/docker-compose.yml
#
# Как использовать:
# 1. Склонируй/скопируй репозиторий NaviSan на сервер, например в /opt/media_stack/navisan/
# 2. Добавь секцию ниже в /opt/media_stack/docker-compose.yml
# 3. Создай /opt/media_stack/navisan/.env по образцу .env.example
# 4. Создай /opt/media_stack/navisan/aliases.json по образцу aliases.example.json
# 5. Создай папки: mkdir -p /opt/media_stack/{staging}
# 6. chown -R 1000:1000 /opt/media_stack/staging
# 7. docker compose up -d navisan

services:
  navisan:
    build: /opt/media_stack/navisan   # путь к клону репозитория на сервере
    image: navisan:latest
    container_name: navisan
    user: "1000:1000"
    restart: unless-stopped
    volumes:
      # Inbox — сюда slskd складывает готовые закачки
      - /opt/media_stack/downloads:/inbox:rw
      # Staging — временная папка обработки (NaviSan работает здесь)
      - /opt/media_stack/staging:/staging:rw
      # Library — готовые альбомы, которые сканирует Navidrome
      - /opt/media_stack/music:/library:rw
      # База Navidrome — только для чтения (сверка канонических имён артистов)
      - /opt/media_stack/navidrome/navidrome.db:/data/navidrome.db:ro
      # Личные данные — снаружи образа, в git не попадают
      - /opt/media_stack/navisan/aliases.json:/app/aliases.json:rw
      - /opt/media_stack/navisan/.env:/app/.env:ro
    environment:
      # Переменные окружения переопределяют значения из .env
      # (можно оставить пустыми — dotenv подхватит из смонтированного /app/.env)
      - NAVISAN_INBOX=/inbox
      - NAVISAN_STAGING=/staging
      - NAVISAN_LIBRARY=/library
      - NAVISAN_DB=/data/navidrome.db
      - NAVISAN_ALIASES=/app/aliases.json
    # Нет открытых портов — бот работает только через Telegram Bot API (long polling)
